# 環境名はキーの一部なので、一度決めたら変えない。
# cxxflags は -I を足す前の形。pj が -Ilib、問題のディレクトリ、-Ithird_party/simde
# を足してからコンパイルする。記録の cxxflags には足したあとの文字列が入る。
# runs_on = "self" は手元専用で、CI のマトリクスには出さない。
# x64 の 2 環境は、土台の命令 (x86-64-v3 に pclmul と vpclmulqdq を足したもの) をオプションで
# 渡す。土台に無い命令 (AVX-512、GFNI) は、使う提出がソースで宣言する。2026-09-25 に -march を
# 一度外し、同じ日に土台だけを戻した (DESIGN.md の「-march を外してソースで宣言する記録」)。
# arm の 2 環境は、GitHub の arm のランナー (Neoverse-N2) に合わせて -mcpu=neoverse-n2+aes にする。
# +aes は PMULL のためで、SIMDe は __ARM_FEATURE_AES があるときだけ _mm_clmulepi64_si128 を
# PMULL で組む (clang は 22 から)。

[[env]]
name = "x64-gcc"
runs_on = "ubuntu-24.04"
cxx = "g++-15"
cxxflags = "-std=gnu++23 -Wall -Wextra -O2 -march=x86-64-v3 -mpclmul -mvpclmulqdq -flto=auto -pthread"

[[env]]
name = "x64-clang"
runs_on = "ubuntu-24.04"
cxx = "clang++-21"
cxxflags = "-std=gnu++23 -Wall -Wextra -O2 -march=x86-64-v3 -mpclmul -mvpclmulqdq -flto=auto -pthread -fuse-ld=lld"

[[env]]
name = "arm-gcc"
runs_on = "ubuntu-24.04-arm"
cxx = "g++-15"
cxxflags = "-std=gnu++23 -Wall -Wextra -O2 -mcpu=neoverse-n2+aes -flto=auto -pthread -DUSE_SIMDE -DSIMDE_ENABLE_NATIVE_ALIASES"

[[env]]
name = "arm-clang"
runs_on = "ubuntu-24.04-arm"
cxx = "clang++-21"
cxxflags = "-std=gnu++23 -Wall -Wextra -O2 -mcpu=neoverse-n2+aes -flto=auto -pthread -fuse-ld=lld -DUSE_SIMDE -DSIMDE_ENABLE_NATIVE_ALIASES"

[[env]]
name = "local"
runs_on = "self"
cxx = "c++"
cxxflags = "-std=gnu++23 -Wall -Wextra -O2 -DUSE_SIMDE -DSIMDE_ENABLE_NATIVE_ALIASES"
