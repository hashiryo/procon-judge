name: judge

on:
  push:
    branches: [main]
  # Library の master への push。送り手は hashiryo/Library の procon-judge.yml。
  repository_dispatch:
    types: [library-push]
  schedule:
    # 03:00 と 15:00 JST。取りこぼしを埋める。やることが 0 件なら run は立たず、
    # plan だけで 2 分ほどで終わる。
    - cron: "0 18 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:

# 記録を失いたくないので、実行中のものを打ち切らずに待たせる。
concurrency:
  group: judge
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # キーの計算や出力比較が壊れると記録の意味が変わるので、手元だけでなくここでも
  # 回す。環境の定義と下のマトリクスがずれていないかもここで見ている。
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv run pytest -q

  # CPU モデルはマシンが割り当たるまで分からないので、モデルに依存しない判断
  # だけをここで済ませる。テストデータは 1 バイトも触らない。キーに要る
  # cases_hash は既存の記録から借りる。
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: results を読む
        uses: actions/checkout@v7
        with:
          ref: results
          path: .results
          fetch-depth: 1

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      # 閉包を作るのに要る。取れないとライブラリを使う提出が立たなくなるので、
      # そのぶんは次の実行が拾う。
      - name: ライブラリを取る
        continue-on-error: true
        run: git clone --depth=1 https://github.com/hashiryo/Library.git lib

      - name: 計画する
        id: plan
        run: uv run pj plan --store .results --github-output "$GITHUB_OUTPUT"

  run:
    needs: plan
    # やることが 0 件なら 1 本も立てない。空のマトリクスはエラーになるので、
    # ここで止める。
    if: needs.plan.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # 既定の名前には matrix の値が全部並ぶ。読める長さに切る。
    # # から後ろを YAML のコメントにされるので、引用符で囲む。
    name: "run (${{ matrix.env }} #${{ matrix.job }})"
    runs-on: ${{ matrix.runs_on }}
    steps:
      # arm では x86 の intrinsics を SIMDe で動かすので submodule が要る。
      - uses: actions/checkout@v7
        with:
          submodules: true

      # 先端の状態しか要らないので fetch-depth: 1。履歴が増えても時間が変わらない。
      - name: results を読む
        uses: actions/checkout@v7
        with:
          ref: results
          path: .results
          fetch-depth: 1

      # setup-uv は v8 以降、浮動のメジャータグを出していない。正確な版で固定する。
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      # 入らなかったら落とす。別のコンパイラで代用すると、環境名が名乗るものと
      # 実際に測ったものがずれた記録が残る。取りこぼしは次の実行が拾う。
      - name: コンパイラを入れる
        run: |
          set -eux
          if [ "${{ matrix.toolchain }}" = "gcc" ]; then
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
            sudo apt-get update
            sudo apt-get install -y g++-15
            g++-15 --version
          else
            sudo apt-get update
            sudo apt-get install -y wget lsb-release software-properties-common gnupg
            wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
            sudo bash /tmp/llvm.sh 21 all
            # -fuse-ld=lld は PATH の ld.lld を探すが、apt.llvm.org は版つきの
            # 名前しか置かない。別名を足す。
            sudo ln -sf /usr/bin/ld.lld-21 /usr/local/bin/ld.lld
            clang++-21 --version
          fi

      # テストデータの actions/cache は置かない。全問題ぶんを 1 つの塊で持つと
      # 10 GB を超えて載らないし、1 問しか要らない回でも塊ごと落とすことになる。
      # 走らせる問題のぶんだけ保管庫から落とし (1 問 1 アセット)、測り終えたら
      # 捨てる (--evict-testdata)。ランナーの disk は 14 GB ほどしか無い。

      # pin しない。実行のたびに最新を取る。
      # 取れなくても、ライブラリを使わない提出は走る。
      - name: ライブラリを取る
        continue-on-error: true
        run: git clone --depth=1 https://github.com/hashiryo/Library.git lib

      # 書き先をドットで始めない。upload-artifact は既定で隠しファイルを除く。
      # 取れなかったテストデータは保管庫から取る。原本まで行ったら保管庫へ上げる。
      - name: 実行
        env:
          TESTDATA_TOKEN: ${{ secrets.TESTDATA_TOKEN }}
          YUKICODER_TOKEN: ${{ secrets.YUKICODER_TOKEN }}
        run: >
          uv run pj run
          --env ${{ matrix.env }}
          --job ${{ matrix.job }}
          --jobs ${{ matrix.jobs }}
          --budget ${{ matrix.budget }}
          --minutes ${{ matrix.minutes }}
          --evict-testdata
          --store .results
          --out ${{ runner.temp }}/records

      # 全部スキップされた実行では 1 件も出ない。それは正常なので上げない。
      # 上げると決めたのに空だったときは、取りこぼしなので失敗にする。
      - name: 記録が出たか
        if: always()
        id: records
        run: |
          if find "${{ runner.temp }}/records" -name '*.jsonl' -print -quit 2>/dev/null | grep -q .; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v7
        if: always() && steps.records.outputs.any == 'true'
        with:
          name: records-${{ matrix.env }}-${{ matrix.job }}
          path: ${{ runner.temp }}/records
          if-no-files-found: error

  collect:
    needs: [plan, run]
    # run が 1 本も立たなくても通す。lib/ が動けば参考の判定が変わるので、
    # サイトは作り直す。
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    # deploy-pages はこの名前の environment を要求する。
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: results を読む
        uses: actions/checkout@v7
        with:
          ref: results
          path: .results
          fetch-depth: 1

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/records

      - name: 記録をまとめる
        run: uv run pj records append ${{ runner.temp }}/records --store .results

      # 並列で results に push すると衝突するので、押すのは collect だけ。それでも
      # 手作業の push や、schedule と push の run の重なりで弾かれることはある。
      # 弾かれたら最新の results を取り直して、その上に記録を足し直してから押す。
      # git の rebase は同じ jsonl への追記同士が衝突するので、記録の単位でやり直す
      # (append は同じキーの記録を飛ばすので二重には入らない)。
      - name: results に push する
        run: |
          git -C .results config user.name "github-actions[bot]"
          git -C .results config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git -C .results add -A
            if git -C .results diff --cached --quiet; then
              echo "増えた記録はありません"
              exit 0
            fi
            git -C .results commit -q -m "記録を追加 (${GITHUB_SHA::7})"
            if git -C .results push origin HEAD:results; then
              exit 0
            fi
            echo "push が弾かれました (${attempt} 回目)。results を取り直して積み直します"
            git -C .results fetch --depth=1 origin results
            git -C .results reset --hard origin/results
            uv run pj records append "${RUNNER_TEMP}/records" --store .results
          done
          echo "::error::results への push に 5 回続けて失敗しました"
          exit 1

      # 記録が古くなっていないかは include 閉包を作り直して見るので、ここでも
      # ライブラリが要る。取れなければライブラリを使う提出の判定だけが落ちる。
      - name: ライブラリを取る
        continue-on-error: true
        run: git clone --depth=1 https://github.com/hashiryo/Library.git lib

      # サイトはビルド出力なので保存しない。記録から毎回作り直す。
      - name: サイトを作る
        run: uv run pj site build --store .results --out site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Pages へ出す
        id: pages
        uses: actions/deploy-pages@v5
