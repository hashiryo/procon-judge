name: judge

on:
  push:
    branches: [main]
  # Library の master への push。送り手は hashiryo/Library の procon-judge.yml。
  repository_dispatch:
    types: [library-push]
  schedule:
    # 03:00 と 15:00 JST。取りこぼしを埋める。やることが 0 件なら run は立たず、
    # plan だけで 2 分ほどで終わる。
    - cron: "0 18 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:

# 記録を失いたくないので、実行中のものを打ち切らずに待たせる。
concurrency:
  group: judge
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # キーの計算や出力比較が壊れると記録の意味が変わるので、手元だけでなくここでも
  # 回す。環境の定義と下のマトリクスがずれていないかもここで見ている。
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv run pytest -q

  # CPU モデルはマシンが割り当たるまで分からないので、モデルに依存しない判断
  # だけをここで済ませる。決めるのは環境ごとの本数と、やることが 0 件かどうか。
  # どの問題をどのジョブが測るかは run のジョブが宣言で取る。テストデータは
  # 1 バイトも触らない。キーに要る cases_hash は既存の記録から借りる。
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
      # この run の全ジョブが使うライブラリの commit。run の途中で Library に push が
      # あっても、同じ run の中で違う commit を測ったり判定したりしない。
      library_sha: ${{ steps.lib.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: results を読む
        uses: actions/checkout@v7
        with:
          ref: results
          path: .results
          fetch-depth: 1

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      # 閉包を作るのに要る。取れないとライブラリを使う提出が立たなくなるので、
      # そのぶんは次の実行が拾う。ここで取った commit を run と collect にも使わせる。
      - name: ライブラリを取る
        id: lib
        continue-on-error: true
        run: |
          git clone --depth=1 https://github.com/hashiryo/Library.git lib
          echo "sha=$(git -C lib rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 計画する
        id: plan
        run: uv run pj plan --store .results --github-output "$GITHUB_OUTPUT"

  run:
    needs: plan
    # やることが 0 件なら 1 本も立てない。空のマトリクスはエラーになるので、
    # ここで止める。
    if: needs.plan.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # 1 本のジョブは組 (x64 / arm) の全環境を担う。稀な CPU モデルに当たった 1 本が
    # その場で gcc と clang の両方を測るため。
    # 既定の名前には matrix の値が全部並ぶ。読める長さに切る。
    # # から後ろを YAML のコメントにされるので、引用符で囲む。
    name: "run (${{ matrix.group }} #${{ matrix.job }})"
    runs-on: ${{ matrix.runs_on }}
    # 宣言は refs/claims/ への push なので、このジョブだけ書き込みが要る。
    permissions:
      contents: write
    steps:
      # arm では x86 の intrinsics を SIMDe で動かすので submodule が要る。
      - uses: actions/checkout@v7
        with:
          submodules: true

      # 先端の状態しか要らないので fetch-depth: 1。履歴が増えても時間が変わらない。
      - name: results を読む
        uses: actions/checkout@v7
        with:
          ref: results
          path: .results
          fetch-depth: 1

      # setup-uv は v8 以降、浮動のメジャータグを出していない。正確な版で固定する。
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      # 組の全コンパイラを入れる。片方が入らなくても止めない。pj run が使えない
      # コンパイラの環境を飛ばして残りで測る。別のコンパイラで代用すると、環境名が
      # 名乗るものと実際に測ったものがずれた記録が残る。取りこぼしは次の実行が拾う。
      - name: コンパイラを入れる
        env:
          TOOLCHAINS: ${{ matrix.toolchains }}
        run: |
          set -ux
          for toolchain in ${TOOLCHAINS//,/ }; do
            if [ "$toolchain" = "gcc" ]; then
              if sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test \
                && sudo apt-get update && sudo apt-get install -y g++-15; then
                g++-15 --version
              else
                echo "::warning::g++-15 を入れられませんでした。gcc の環境は飛ばします"
              fi
            else
              if sudo apt-get update \
                && sudo apt-get install -y wget lsb-release software-properties-common gnupg \
                && wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh \
                && sudo bash /tmp/llvm.sh 21 all; then
                # -fuse-ld=lld は PATH の ld.lld を探すが、apt.llvm.org は版つきの
                # 名前しか置かない。別名を足す。
                sudo ln -sf /usr/bin/ld.lld-21 /usr/local/bin/ld.lld
                clang++-21 --version
              else
                echo "::warning::clang++-21 を入れられませんでした。clang の環境は飛ばします"
              fi
            fi
          done

      # テストデータの actions/cache は置かない。全問題ぶんを 1 つの塊で持つと
      # 10 GB を超えて載らないし、1 問しか要らない回でも塊ごと落とすことになる。
      # 走らせる問題のぶんだけ保管庫から落とし (1 問 1 アセット)、測り終えたら
      # 捨てる (--evict-testdata)。ランナーの disk は 14 GB ほどしか無い。

      # plan が決めた commit を取る。plan が取れていなければ (sha が空) 最新を取る。
      # 取れなくても、ライブラリを使わない提出は走る。
      - name: ライブラリを取る
        continue-on-error: true
        env:
          LIBRARY_SHA: ${{ needs.plan.outputs.library_sha }}
        run: |
          git init -q lib
          git -C lib remote add origin https://github.com/hashiryo/Library.git
          git -C lib fetch --depth=1 origin "${LIBRARY_SHA:-HEAD}"
          git -C lib checkout -q FETCH_HEAD

      # 引いた CPU モデルで未計測の問題を 1 つ宣言して、組の全環境で測る、を時間の
      # 上限まで繰り返す。宣言は refs/claims/<run id>/... の ref で、他のジョブに見える。
      # 書き先をドットで始めない。upload-artifact は既定で隠しファイルを除く。
      # 取れなかったテストデータは保管庫から取る。原本まで行ったら保管庫へ上げる。
      - name: 実行
        env:
          TESTDATA_TOKEN: ${{ secrets.TESTDATA_TOKEN }}
          YUKICODER_TOKEN: ${{ secrets.YUKICODER_TOKEN }}
        run: >
          uv run pj run
          --env ${{ matrix.envs }}
          --claim-run ${{ github.run_id }}
          --job ${{ matrix.job }}
          --jobs ${{ matrix.jobs }}
          --minutes ${{ matrix.minutes }}
          --evict-testdata
          --store .results
          --out ${{ runner.temp }}/records

      # 全部スキップされた実行では 1 件も出ない。それは正常なので上げない。
      # 上げると決めたのに空だったときは、取りこぼしなので失敗にする。
      - name: 記録が出たか
        if: always()
        id: records
        run: |
          if find "${{ runner.temp }}/records" -name '*.jsonl' -print -quit 2>/dev/null | grep -q .; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v7
        if: always() && steps.records.outputs.any == 'true'
        with:
          name: records-${{ matrix.group }}-${{ matrix.job }}
          path: ${{ runner.temp }}/records
          if-no-files-found: error

  collect:
    needs: [plan, run]
    # run が 1 本も立たなくても通す。lib/ が動けば参考の判定が変わるので、
    # サイトは作り直す。
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    # deploy-pages はこの名前の environment を要求する。
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: results を読む
        uses: actions/checkout@v7
        with:
          ref: results
          path: .results
          fetch-depth: 1

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/records

      - name: 記録をまとめる
        run: uv run pj records append ${{ runner.temp }}/records --store .results

      # 並列で results に push すると衝突するので、押すのは collect だけ。それでも
      # 手作業の push や、schedule と push の run の重なりで弾かれることはある。
      # 弾かれたら最新の results を取り直して、その上に記録を足し直してから押す。
      # git の rebase は同じ jsonl への追記同士が衝突するので、記録の単位でやり直す
      # (append は同じキーの記録を飛ばすので二重には入らない)。
      - name: results に push する
        run: |
          git -C .results config user.name "github-actions[bot]"
          git -C .results config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git -C .results add -A
            if git -C .results diff --cached --quiet; then
              echo "増えた記録はありません"
              exit 0
            fi
            git -C .results commit -q -m "記録を追加 (${GITHUB_SHA::7})"
            if git -C .results push origin HEAD:results; then
              exit 0
            fi
            echo "push が弾かれました (${attempt} 回目)。results を取り直して積み直します"
            git -C .results fetch --depth=1 origin results
            git -C .results reset --hard origin/results
            uv run pj records append "${RUNNER_TEMP}/records" --store .results
          done
          echo "::error::results への push に 5 回続けて失敗しました"
          exit 1

      # 記録が古くなっていないかは include 閉包を作り直して見るので、ここでも
      # ライブラリが要る。run と同じ commit を取る。取れなければライブラリを使う
      # 提出の判定だけが落ちる。
      - name: ライブラリを取る
        continue-on-error: true
        env:
          LIBRARY_SHA: ${{ needs.plan.outputs.library_sha }}
        run: |
          git init -q lib
          git -C lib remote add origin https://github.com/hashiryo/Library.git
          git -C lib fetch --depth=1 origin "${LIBRARY_SHA:-HEAD}"
          git -C lib checkout -q FETCH_HEAD

      # サイトはビルド出力なので保存しない。記録から毎回作り直す。
      - name: サイトを作る
        run: uv run pj site build --store .results --out site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Pages へ出す
        id: pages
        uses: actions/deploy-pages@v5

      # 宣言の ref を消す。この run のぶんと、消し損ねていた古い run のぶん。
      # 消し損ねても宣言は run 単位の名前なので次の run の邪魔にはならない。
      - name: 宣言を掃く
        if: always()
        run: uv run pj claims clean --run-id ${{ github.run_id }}
