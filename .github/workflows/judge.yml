name: judge

on:
  push:
    branches: [main]
  repository_dispatch:
  schedule:
    # 03:00 JST。取りこぼしを埋める。
    - cron: "0 18 * * *"
  workflow_dispatch:

# 記録を失いたくないので、実行中のものを打ち切らずに待たせる。
concurrency:
  group: judge
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # キーの計算や出力比較が壊れると記録の意味が変わるので、手元だけでなくここでも
  # 回す。環境の定義と下のマトリクスがずれていないかもここで見ている。
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv run pytest -q

  run:
    strategy:
      fail-fast: false
      matrix:
        # environments.toml と二重持ちになる。ずれていないかは pytest で見ている。
        include:
          - { env: x64-gcc, runs_on: ubuntu-24.04, toolchain: gcc }
          - { env: x64-clang, runs_on: ubuntu-24.04, toolchain: clang }
          - { env: arm-gcc, runs_on: ubuntu-24.04-arm, toolchain: gcc }
          - { env: arm-clang, runs_on: ubuntu-24.04-arm, toolchain: clang }
    runs-on: ${{ matrix.runs_on }}
    steps:
      # arm では x86 の intrinsics を SIMDe で動かすので submodule が要る。
      - uses: actions/checkout@v7
        with:
          submodules: true

      # 先端の状態しか要らないので fetch-depth: 1。履歴が増えても時間が変わらない。
      - name: results を読む
        uses: actions/checkout@v7
        with:
          ref: results
          path: .results
          fetch-depth: 1

      # setup-uv は v8 以降、浮動のメジャータグを出していない。正確な版で固定する。
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      # 入らなかったら落とす。別のコンパイラで代用すると、環境名が名乗るものと
      # 実際に測ったものがずれた記録が残る。取りこぼしは次の実行が拾う。
      - name: コンパイラを入れる
        run: |
          set -eux
          if [ "${{ matrix.toolchain }}" = "gcc" ]; then
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
            sudo apt-get update
            sudo apt-get install -y g++-15
            g++-15 --version
          else
            sudo apt-get update
            sudo apt-get install -y wget lsb-release software-properties-common gnupg
            wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
            sudo bash /tmp/llvm.sh 21 all
            # -fuse-ld=lld は PATH の ld.lld を探すが、apt.llvm.org は版つきの
            # 名前しか置かない。別名を足す。
            sudo ln -sf /usr/bin/ld.lld-21 /usr/local/bin/ld.lld
            clang++-21 --version
          fi

      # 7 日使われないと消えるので、消えても再取得できる形にしてある。
      # テストデータはただのテキストで環境に依存しないので、キーに env を入れない。
      # キーの v2 はキャッシュの世代。まっさらから取り直させたいときに上げる。
      - name: テストデータのキャッシュ
        uses: actions/cache@v6
        with:
          path: .cache/testcases
          key: testcases-v2-${{ hashFiles('problems/*/problem.toml') }}
          restore-keys: |
            testcases-v2-

      # pin しない。実行のたびに最新を取る。
      # 取れなくても、ライブラリを使わない提出は走る。
      - name: ライブラリを取る
        continue-on-error: true
        run: git clone --depth=1 https://github.com/hashiryo/Library.git lib

      # 書き先をドットで始めない。upload-artifact は既定で隠しファイルを除く。
      # 取れなかったテストデータは保管庫から取る。原本まで行ったら保管庫へ上げる。
      - name: 実行
        env:
          TESTDATA_TOKEN: ${{ secrets.TESTDATA_TOKEN }}
          YUKICODER_TOKEN: ${{ secrets.YUKICODER_TOKEN }}
        run: >
          uv run pj run
          --env ${{ matrix.env }}
          --store .results
          --out ${{ runner.temp }}/records

      # 全部スキップされた実行では 1 件も出ない。それは正常なので上げない。
      # 上げると決めたのに空だったときは、取りこぼしなので失敗にする。
      - name: 記録が出たか
        if: always()
        id: records
        run: |
          if find "${{ runner.temp }}/records" -name '*.jsonl' -print -quit 2>/dev/null | grep -q .; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v7
        if: always() && steps.records.outputs.any == 'true'
        with:
          name: records-${{ matrix.env }}
          path: ${{ runner.temp }}/records
          if-no-files-found: error

  collect:
    needs: run
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    # deploy-pages はこの名前の environment を要求する。
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: results を読む
        uses: actions/checkout@v7
        with:
          ref: results
          path: .results
          fetch-depth: 1

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/records

      - name: 記録をまとめる
        run: uv run pj records append ${{ runner.temp }}/records --store .results

      # 並列で results に push すると衝突するので、押すのは collect だけ。
      - name: results に push する
        working-directory: .results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "増えた記録はありません"
            exit 0
          fi
          git commit -m "記録を追加 (${GITHUB_SHA::7})"
          git push origin HEAD:results

      # 記録が古くなっていないかは include 閉包を作り直して見るので、ここでも
      # ライブラリが要る。取れなければライブラリを使う提出の判定だけが落ちる。
      - name: ライブラリを取る
        continue-on-error: true
        run: git clone --depth=1 https://github.com/hashiryo/Library.git lib

      # サイトはビルド出力なので保存しない。記録から毎回作り直す。
      - name: サイトを作る
        run: uv run pj site build --store .results --out site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Pages へ出す
        id: pages
        uses: actions/deploy-pages@v5
