[project]
name = "procon-judge"
version = "0.1.0"
description = "Self-hosted judge for competitive programming submissions"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
pj = "pj.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pj"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# submodule で持ってきたものは自分のコードではない。
extend-exclude = ["third_party"]
