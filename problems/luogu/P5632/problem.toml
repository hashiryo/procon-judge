id = "luogu-P5632"
title = "【模板】Stoer-Wagner"
url = "https://www.luogu.com.cn/problem/P5632"

# 問題文は本人の Chrome で洛谷のページを読んだ (n ≤ 600、m ≤ n(n - 1)/2、重みの和 ≤ 10^9、連結)。
[limits]
tle_sec = 5.0
mle_mb = 1024

[harness]
kind = "base"

# テストケースは公開されていないので、自作する (gen.py と、Stoer-Wagner の方法を _shared/gmincut と別に書いた
# submissions/reference.hpp)。全域最小カットの書き比べのために足した。
[testdata]
source = "local"
count = 12
generator = "gen.py"
reference = "submissions/reference.hpp"

[compare]
kind = "tokens"

[record]
case_times = true
