<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{TITLE}} - procon-judge</title>
    <link rel="stylesheet" href="../style.css{{STYLE_V}}" />
  </head>
  <body data-src="../data/problems/{{DATA_NAME}}{{DATA_V}}">
    <nav><a href="../index.html">← 問題一覧</a></nav>
    <h1 id="title">読み込み中</h1>
    <p class="sub" id="sub"></p>
    <div class="meta" id="meta"></div>
    <div class="controls" id="controls">
      <label>環境 <select id="env"></select></label>
      <label>CPU <select id="model"></select></label>
    </div>
    <!-- 出す列の選択。problem.js が COLUMNS から作る。 -->
    <div class="controls" id="columns"></div>
    <div class="meta" id="counts"></div>
    <div class="meta" id="combo-meta"></div>
    <div class="meta" id="batch-meta"></div>
    <div class="wrap" id="wrap">
      <table class="fixed" id="table">
        <!-- 列幅も見出しも problem.js が作る。並べ替えの鍵と一緒に持たせるため。 -->
        <colgroup id="cols"></colgroup>
        <thead>
          <tr id="head"></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <!-- ケースごとの計測区間の時間。problem.toml の record.case_times の問題だけ problem.js が出す。 -->
    <section id="cases" hidden>
      <h2>ケースごとの計測区間の時間</h2>
      <p class="note" id="cases-note"></p>
      <div class="wrap">
        <table id="cases-table">
          <thead>
            <tr id="cases-head"></tr>
          </thead>
          <tbody id="cases-rows"></tbody>
        </table>
      </div>
    </section>
    <script src="../problem.js{{SCRIPT_V}}"></script>
  </body>
</html>
