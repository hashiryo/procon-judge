<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>procon-judge</title>
    <link rel="stylesheet" href="style.css{{STYLE_V}}" />
  </head>
  <body data-src="data/index.json{{DATA_V}}">
    <h1>procon-judge</h1>
    <p class="sub" id="sub">読み込み中</p>
    <div class="controls">
      <input id="filter" type="search" placeholder="id か題名で絞る" autocomplete="off" />
      <!-- 実装が 1 本しかない raw の問題は比べる相手がいない。順位を見たいときは外す。 -->
      <label class="check"><input id="multi" type="checkbox" /> 提出が 2 本以上</label>
      <span class="dim" id="shown"></span>
    </div>
    <div id="wrap">
      <table class="index">
        <!-- 見出しは index.js が作る。並べ替えの鍵と一緒に持たせるため。 -->
        <thead>
          <tr id="head"></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <script src="index.js{{SCRIPT_V}}"></script>
  </body>
</html>
